<body>
    <div class="page-container">
        <nav class="navbar top-nav">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">+ Usuarios</span>
                <a href="login" class="btn btn-outline-secondary btn-sm">Cerrar Sesión</a>
            </div>
        </nav>

        <div class="main-layout">
            <main class="content-area">
                <div class="search-box-container">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="form-control search-input"
                            placeholder="Escribe el nombre del usuario a buscar..."
                            [(ngModel)]="searchTerm">
                </div>

                <div class="user-cards-list">
                    <div class="user-card"
                        *ngFor="let user of usuarios | userFilter: searchTerm">
                        
                        <div class="user-details">
                            <div class="user-avatar-small">
                                <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Avatar de usuario">
                            </div>
                            <span class="username-display">
                                &#64;{{ user.username }} <span *ngIf="user.esActual" class="self-tag">(yo)</span>
                            </span>
                        </div>

                        <button
                            *ngIf="!user.esActual"
                            class="btn add-friend-btn"
                            [ngClass]="{
                                'btn-primary': !(solicitudYaEnviada(user.id) || yaEsAmigo(user.id)),
                                'btn-secondary-disabled': solicitudYaEnviada(user.id),
                                'btn-success-disabled': yaEsAmigo(user.id)
                            }"
                            (click)="enviarSolicitud(user.id)"
                            [disabled]="solicitudYaEnviada(user.id) || yaEsAmigo(user.id)"
                        >
                            <ng-container *ngIf="yaEsAmigo(user.id)">
                                <i class="bi bi-check-circle-fill me-1"></i> Ya son amigos
                            </ng-container>
                            <ng-container *ngIf="!yaEsAmigo(user.id) && solicitudYaEnviada(user.id)">
                                <i class="bi bi-clock-fill me-1"></i> Solicitud enviada
                            </ng-container>
                            <ng-container *ngIf="!yaEsAmigo(user.id) && !solicitudYaEnviada(user.id)">
                                <i class="bi bi-person-plus-fill me-1"></i> Añadir amigo
                            </ng-container>
                        </button>
                    </div>
                    
                    <div *ngIf="(usuarios | userFilter: searchTerm).length === 0" class="no-results-state text-center mt-5">
                        <i class="bi bi-person-slash no-results-icon"></i>
                        <p class="no-results-message">No se encontraron usuarios con ese nombre.</p>
                    </div>

                </div>
            </main>

            <app-sidebar></app-sidebar>
            
        </div>
    </div>

</body>
