<body>
  <div class="page-container">
    <nav class="navbar top-nav">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Home</span>
        <a href="login" class="btn btn-outline-secondary btn-sm">Cerrar Sesión</a>
      </div>
    </nav>

    <div class="main-layout">
      <main class="content-area">
        <div class="container-fluid">
          <div class="row g-5">

            <!-- Álbumes de amigos -->
            <div class="col-lg-6" *ngFor="let album of albumesAmigos">
              <a [routerLink]="['/album', album.id]" class="album-link">
                <div class="polaroid-stack">
                  <div class="polaroid-bg" style="transform: rotate(-5deg);"></div>
                  <div class="polaroid-bg" style="transform: rotate(3deg);"></div>
                  <div class="polaroid-main">
                    <span class="user-name">{{ '@' + album.username }}</span>
                    <div class="image-container">
                      <img [src]="album.imagenes[0]" alt="{{ album.nombre }}">
                    </div>
                    <div class="text-content">
                      <p class="card-title">Álbum: {{ album.nombre }}</p>
                      <p class="upload-date">Subido el {{ album.fecha }}</p>
                    </div>
                  </div>
                </div>
              </a>
            </div>

            <!-- Fotos sueltas de amigos -->
            <div class="col-lg-6" *ngFor="let foto of fotosAmigos">
              <div class="photo-card">
                <span class="user-name">{{ '@' + foto.username }}</span>
                <div class="image-container">
                  <img [src]="foto.url" alt="{{ foto.titulo }}">
                </div>
                <div class="text-content">
                  <p class="card-title">Foto: {{ foto.titulo }}</p>
                  <p class="upload-date">Subido el {{ foto.fecha }}</p>
                </div>
              </div>
            </div>

          </div>
        </div>
      </main>

      <app-sidebar></app-sidebar>
    </div>
  </div>
</body>
